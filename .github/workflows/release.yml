name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04 # .deb + .AppImage + .rpm
            args: ""
          - platform: windows-latest # .msi + NSIS .exe
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ai-diff ${{ github.ref_name }}"
          releaseBody: |
            跨平台 Git 更改查看器。下载对应平台的安装包：
            - Windows: `.exe`（NSIS，一键用户级安装，自动创建快捷方式）或 `.msi`
            - macOS: `.dmg`（Apple Silicon 选 aarch64，Intel 选 x64）
            - Linux: `.deb` / `.AppImage` / `.rpm`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
