name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04 # .deb + .AppImage + .rpm
            args: ""
          - platform: windows-latest # .msi + NSIS .exe
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v h="## v$VER" 'index($0,h)==1{f=1;next} f&&/^## /{exit} f{print}' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES=$'跨平台 Git 更改查看器。\n\n下载对应平台的安装包：\n- Windows: `.exe` / `.msi`\n- macOS: `.dmg`\n- Linux: `.deb` / `.AppImage` / `.rpm`'
          fi
          {
            echo "body<<__CL_EOF__"
            echo "$NOTES"
            echo "__CL_EOF__"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # set these repo secrets to enable signed auto-update artifacts
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "GitPrism ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
